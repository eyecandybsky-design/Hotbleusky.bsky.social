name: HotBleusky Media Copy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotbleusky-media-copy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install atproto

      - name: Publish one old DMPhotos media post
        env:
          HB_BSKY_PASSWORD: ${{ secrets.HB_BSKY_PASSWORD }}
          SOURCE_ACCOUNT: dmphotos.bsky.social
          BSKY_USERNAME: hotbleusky.bsky.social
          STATE_FILE: hotbleusky_media_state.json
          MIN_AGE_DAYS: '30'
          MAX_PAGES: '30'
          MAX_POSTS: '1'
          DRY_RUN: 'false'
        run: python hotbleusky_media.py

      - name: Persist published history
        if: success()
        run: |
          if [ -f hotbleusky_media_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add hotbleusky_media_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update HotBleusky media history"
              git push
            fi
          fi
